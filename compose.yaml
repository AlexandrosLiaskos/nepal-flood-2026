name: nepal-flood-2026

services:
  app:
    image: python:3.12-alpine
    container_name: nepal-flood-2026
    command:
      - python
      - /app/server.py
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --app-dir
      - /app/public
      - --visit-count-file
      - /app/data/visits.json
    expose:
      - "8765"
    volumes:
      - ./server.py:/app/server.py:ro
      - ./public:/app/public:ro
      - ./data:/app/data
    networks:
      nkua_proxy:
        aliases:
          - nepal-flood-2026
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  nkua_proxy:
    external: true
    name: nkua-proxy
